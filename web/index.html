<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<!--HEAD-->
</head>
<body>
<main id="app" class="page">
<!--TOPBAR-->

  <header class="intro">
    <h1>{{h1}}</h1>
    <p>{{sub}}</p>
  </header>

  <div class="work-row">
    <div class="editor-col">
      <div class="editor-wrap">
        <div class="editor-input">
          <pre id="sql-highlight" aria-hidden="true"></pre>
          <textarea id="sql-input" aria-label="{{sqlLabel}}" placeholder="SELECT * FROM Country WHERE Population > 50000000 ORDER BY Population DESC;" spellcheck="false"></textarea>
        </div>
        <div class="editor-footer">
          <button class="run" id="run-btn">{{run}}</button>
          <span class="hint">{{runHint}}</span>
          <div class="editor-tools">
            <button type="button" class="tool-btn" id="format-btn" title="{{formatTitle}}">{{format}}</button>
            <button type="button" class="tool-btn" id="history-btn" title="{{historyTitle}}">{{history}}</button>
            <div class="history-panel" id="history-panel" style="display:none;"></div>
          </div>
          <div class="tool-msg" id="tool-msg"></div>
        </div>
      </div>

      <div class="ask-row">
        <span class="ask-label">{{help}}</span>
        <a class="ask-btn gpt" id="ask-gpt" href="https://chatgpt.com/" target="_blank" rel="noopener"><span class="dot"></span>{{askGpt}}</a>
        <a class="ask-btn claude" id="ask-claude" href="https://claude.ai/new" target="_blank" rel="noopener"><span class="dot"></span>{{askClaude}}</a>
      </div>

      <div class="results-col">
        <div id="status-line" class="status-line" style="display:none;"></div>
        <div id="error-area" class="error-area"></div>
        <div id="results" class="results"></div>
      </div>
    </div>

    <div class="viz-col">
      <div class="viz-tabs">
        <button type="button" class="viz-tab active" data-viz="er">{{tabTables}}</button>
        <button type="button" class="viz-tab" data-viz="pipeline">{{tabPipeline}}</button>
      </div>
      <div id="viz-er" class="viz-panel"></div>
      <div id="viz-pipeline" class="viz-panel" style="display:none;"></div>
    </div>
  </div>

<!--FOOT-->
</main>
<!--SCRIPTS-->
</body>
</html>
